# gitleaks config.
#
# This repo's rule files and tests contain intentional *fake* secrets
# (test fixtures that exercise detection logic). We extend the default
# rule set but allowlist the paths that are known to contain
# test/fixture data — secrets introduced outside those paths still fail.

title = "taintly secret scan"

[extend]
useDefault = true

[allowlist]
description = "Fixtures and rule definitions contain intentional fake secrets"
paths = [
    '''tests/fixtures/.*''',
    '''tests/playground/.*''',
    '''tests/_rule_pack_hashes\.json''',
    '''tests/.*test_.*\.py''',
    '''taintly/rules/.*\.py''',
    '''taintly/testing/.*\.py''',
    '''benchmark/corpus/.*''',
    '''docs/.*\.md''',
    '''\.gitleaks\.toml''',
]
# Example-style strings that look like secrets but aren't.
regexTarget = "match"
regexes = [
    '''example\.com''',
    '''attacker\.com''',
    '''your-secret-here''',
    '''REPLACE-ME''',
    # Canonical fake credentials used in tests/playground/fake-secrets/.
    # These are documented-fake values from upstream provider docs OR
    # contain literal FAKE/EXAMPLE/DO-NOT-USE markers; not real secrets.
    '''AKIAIOSFODNN7EXAMPLE''',
    '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
    '''(?i)FAKE-FAKE-FAKE''',
    '''(?i)NOT-A-REAL-KEY''',
    '''(?i)DO-NOT-USE''',
    '''ghp_FAKE[A-Z]+''',
]
