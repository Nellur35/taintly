name: Release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
# setuptools-scm derives the version from the tag, so the tag IS the version.
#
# ONE-TIME PREREQUISITE (a maintainer, on pypi.org): add a Trusted Publisher for
# project "taintly" -> this repo -> workflow ".github/workflows/release.yml" ->
# environment "pypi". Until that exists the "Publish to PyPI" step fails (OIDC has
# nothing to authenticate against); fix the config and re-run the job.
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Build, publish to PyPI, cut a GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/taintly
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for PyPI trusted publishing + PEP 740 attestations
    steps:
      # A new workflow's exact egress set isn't empirically known yet, so start in
      # AUDIT (monitor, don't block) exactly as this repo's other allow-lists were
      # learned. Tighten to `block` after the first green run, with the observed
      # endpoints (expect: github.com, pypi.org, files.pythonhosted.org,
      # upload.pypi.org, {fulcio,rekor,tuf-repo-cdn}.sigstore.dev,
      # token.actions.githubusercontent.com).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags so setuptools-scm derives the version from the tag

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Version sanity — built dists must carry the tag
        run: |
          python - <<'PY'
          import pathlib
          tag = "${{ github.ref_name }}".lstrip("v")
          dists = [p.name for p in pathlib.Path("dist").glob("*")]
          assert dists, "no dists were built"
          assert all(tag in d for d in dists), f"tag {tag} not in built dists {dists}"
          print("OK:", dists)
          PY

      - name: Publish to PyPI (trusted publishing — no stored token)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
