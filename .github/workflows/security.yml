name: Security

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

# Cancel superseded runs on the same ref; never cancel on main (a
# scheduled/main run completes) — see ci.yml for the rationale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bandit — Python static application security testing (SAST)
  # Fails on any MEDIUM+ severity / MEDIUM+ confidence finding.
  # nosec comments in source are respected.
  # ---------------------------------------------------------------------------
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Blocked egress boundary (allow-list = pip install + checkout).
      # See ci.yml's lint job for the full rationale. First step.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            codeload.github.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev toolchain (hash-pinned)
        # Hash-pinned install — see ci.yml's lint job for the rationale.
        # The lock includes bandit at the pin in requirements-dev.in.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Run bandit SAST
        # Config lives in pyproject.toml [tool.bandit] so strictness
        # is version-controlled with the code rather than scattered
        # across CLI flags. Ratcheted to severity=low, confidence=high
        # — every low-severity high-confidence finding either is a
        # real smell or carries an inline `# nosec BXXX` with a
        # reason comment.
        run: bandit -r taintly/ -c pyproject.toml -x taintly/testing/ -f txt

  # ---------------------------------------------------------------------------
  # pip-audit — dependency vulnerability scan
  # taintly has zero third-party runtime deps; this guards against
  # vulnerabilities introduced by dev/build tooling.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Blocked egress boundary (allow-list = pip install + checkout).
      # See ci.yml's lint job for the full rationale. First step.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            codeload.github.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install dev toolchain (hash-pinned)
        # Hash-pinned install — see ci.yml's lint job for the rationale.
        # Installing the full lock here means pip-audit below audits the
        # ENTIRE dev/build toolchain (ruff, mypy, pytest, hypothesis,
        # bandit, pip-audit and their transitive deps), not just
        # pip-audit itself — broader coverage of the surface this gate
        # exists to watch.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Audit installed packages
        # GHSA-58qw-9mgm-455v is in pip itself (the build tool), not in
        # any package taintly ships — taintly has zero runtime deps. pip's
        # own vulnerability is patched by pip's maintainers in a later pip
        # version, so it's ignored here. Every OTHER installed package is
        # the hash-pinned dev/build toolchain from requirements-dev.lock,
        # which is exactly what this gate is meant to scan.
        run: pip-audit --ignore-vuln GHSA-58qw-9mgm-455v
