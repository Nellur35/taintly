name: CodeQL

# PSE Domain 3.1 — SAST via dataflow analysis.
# Complementary to bandit (pattern-based SAST). CodeQL does actual
# dataflow tracking — finds taint flows, null-propagation bugs, and
# use-after-free-shaped Python bugs that bandit regexes cannot see.
#
# For taintly specifically, CodeQL catches "source → sink" issues in
# the analyzer itself — exactly the class of bug the product exists to
# find in OTHER workflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep-dataflow run catches issues the incremental PR run
    # might miss (DB maturity improves over time).
    - cron: "0 10 * * 1"

permissions:
  contents: read

# Cancel superseded runs on the same ref; never cancel on main — see
# ci.yml for the rationale. CodeQL is the slowest job, so dropping the
# obsolete run on a re-push is the biggest single compute saving.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    # CodeQL is the slowest job (database build + query execution);
    # 30 min matches GitHub's own default-recommended bound and is
    # well above the typical 10-15 min a Python-only repo needs.
    timeout-minutes: 30
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required for auto-build of the repo under analysis.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add more languages here if the repo ever ships non-Python code
        # (e.g. bundled rust helpers). `python` is the only language
        # currently in scope.
        language: ["python"]

    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See ci.yml's lint job for the full rationale. First
      # step so it monitors the CodeQL DB build / query egress too.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds recommended queries beyond the
          # default set; `security-and-quality` also flags non-security
          # code-quality issues. Pick security-extended: the noise floor
          # of security-and-quality is too high for a security tool's
          # own CI.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
