name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so a new push to an open PR
# doesn't run a full duplicate matrix (lint, mypy x3, unit, rule x3,
# fuzz, Windows, self-audit) against stale code. cancel-in-progress is
# gated on the ref: on main we never cancel — a release-relevant run
# must not be killed mid-flight — while on PR / branch refs we drop the
# obsolete run the moment a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff check + format enforcement
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Dogfooding SEC10-GH-001 — explicit bound prevents a hung or
    # compromised job from running up to the 6-hour default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # step-security/harden-runner establishes an AUDITED EGRESS
      # BOUNDARY on the runner — the one runtime control this CI didn't
      # yet model, on-brand for a tool whose thesis is that pipelines
      # can't be turned against their owners. Started in `audit` mode to
      # learn the legitimate outbound set; once the run summaries confirm
      # it (expected: pypi.org:443, files.pythonhosted.org:443,
      # github.com:443, codeload.github.com:443) flip to:
      #     egress-policy: block
      #     allowed-endpoints: >
      #       pypi.org:443
      #       files.pythonhosted.org:443
      #       github.com:443
      #       codeload.github.com:443
      # MUST be the first step so it can monitor every later step's
      # egress. Linux-only — deliberately NOT added to the windows-test
      # job (harden-runner supports Ubuntu runners only).
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev toolchain (hash-pinned)
        # `--require-hashes` fails closed if PyPI (or a mirror / MITM)
        # serves a wheel whose hash differs from requirements-dev.lock —
        # the same immutable-digest discipline SEC3 enforces on Actions,
        # now applied to our own PyPI deps. The lock is the universal,
        # fully-resolved superset; every Linux job installs all of it so
        # there is a single file to maintain. Regenerate with the uv
        # command documented in requirements-dev.in after any bump.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Check lint
        run: ruff check taintly/

      - name: Check formatting
        run: ruff format --check taintly/

      - name: README coverage table is in sync with rule pack
        run: python scripts/update_readme_coverage.py --check

      - name: Doc/impl drift gate
        # Catches the "documented contract isn't actually enforced"
        # bug class. Audit chunk cross-cutting A — see the script
        # for the four specific drift patterns it watches for. Fast
        # heuristic; runs in <100ms.
        run: python scripts/check_doc_impl_drift.py

      - name: Duplicate-rule gate (no two rules fire identically)
        run: python scripts/check_rule_duplicates.py

      - name: Encoding gate (no mojibake in user-facing rule text)
        run: python scripts/check_rule_encoding.py

      - name: No-rules-change gate (rule-pack output stable across fixtures)
        run: python scripts/no_rules_change_gate.py --check

      - name: Metadata-drift gate (rule definitions stable)
        run: python scripts/no_rules_metadata_drift.py --check

      - name: No-leaks gate (public repo allow-list)
        # Second-tier defence against private R&D artifacts leaking
        # from the lab. The first tier is the lab's publish manifest;
        # this one runs from the public repo so it catches paths that
        # bypass the manifest entirely. See the script for the rules.
        run: python scripts/check_public_no_leaks.py

      - name: No-internal-narrative gate (clean-repo)
        # Fails on Phase-N milestone labels, iter-N labels, internal
        # PR refs, and similar working-log shorthand left over from
        # private R&D sessions. Companion to the no-leaks gate: that
        # one blocks whole-file leaks, this one blocks in-file
        # narrative leaks.
        run: python scripts/check_internal_narrative.py --all-tracked

  # ---------------------------------------------------------------------------
  # mypy — static type check (PSE Domain 2.1)
  # Loose mode: enables the highest-value bug classes (undefined name,
  # arg mismatch, missing return) without requiring every function to be
  # annotated. Runs across the full Python version matrix so we catch
  # stdlib typing drift that only surfaces on older interpreters
  # (e.g. `list[X]` semantics across 3.10 → 3.12).
  # ---------------------------------------------------------------------------
  type-check:
    name: mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See the lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev toolchain (hash-pinned)
        # Hash-pinned install — see the lint job for the rationale.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Run mypy
        run: mypy --python-version ${{ matrix.python-version }}

  # ---------------------------------------------------------------------------
  # Unit tests — reporters, models, engine
  # Tests the layer beneath pattern matching: output correctness, filtering,
  # line numbers, ENGINE-ERR handling, discover_files, golden fixture.
  # Runs on a single Python version (fast feedback path).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See the lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev toolchain (hash-pinned)
        # Hash-pinned install — see the lint job for the rationale. The
        # lock carries pytest / pytest-cov and hypothesis (which pulls in
        # the property-based tests in tests/unit/test_pattern_properties.py
        # — PSE Domain 3.4) at the pins recorded in requirements-dev.in.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Unit + integration + evasion + playground tests
        # Branch coverage enabled here too (not just via pyproject) so
        # the floor reflects both line AND branch coverage. Current
        # floor is 78; target is 85 — see pyproject.toml
        # [tool.coverage.report] for the ratchet plan and per-module
        # drag list. MUST stay in lockstep with pyproject's fail_under.
        # tests/playground/ is the light-e2e harness — fixture-driven
        # find/fix assertions plus posture-rule API replay; cheap and
        # gates against the kind of CI miss that surfaced in the
        # 2026-05-05 e2e session.
        run: |
          pytest tests/unit/ tests/integration/ tests/evasion/ tests/playground/ \
            --tb=short -q \
            --cov=taintly \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=78

      - name: Per-module coverage floors
        # The global 78% gate above can hide per-module regressions —
        # a PR could drop fixes.py from 46% to 30% while the global
        # floor stays above 78. The pyproject [tool.coverage.report]
        # ratchet plan documents per-module targets; this step
        # enforces the CURRENT per-module floor (lower than the
        # target — same growth-only discipline as
        # _KNOWN_MUTATION_GAPS) so coverage in those modules can only
        # go UP. Raise the floor in the same PR that lands new tests
        # for that module.
        run: python scripts/check_per_module_coverage.py coverage.xml

  # ---------------------------------------------------------------------------
  # Rule tests — self-test, mutation tests, integration tests (pattern layer)
  # Tests pattern matching logic across Python version matrix.
  # ---------------------------------------------------------------------------
  rule-test:
    name: Rule tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See the lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Rule self-tests
        run: python -m taintly --self-test --no-color
        # Exit 10 if any rule self-test fails

      - name: FP simulator (advisory)
        # Benignises each rule's own positive samples and reports rules
        # that still fire. This advisory release exits 0
        # regardless, so this step never blocks a merge; it surfaces
        # FP-prone rules in the build log for triage. See the docstring
        # on ``taintly.testing.fp_simulator``.
        run: python -m taintly --self-test --fp-simulate --no-color

      - name: Mutation tests (100% kill rate modulo documented gaps)
        # ``100% kill rate`` is the wall-clock claim, but the
        # underlying harness counts entries in
        # ``taintly.testing.self_test._KNOWN_MUTATION_GAPS`` as kills
        # — every entry there is a documented rule-engineering gap
        # that the kill-rate gate intentionally tolerates while it's
        # being worked. The honest description: "100% kill rate
        # modulo N documented gaps." See the docstring on
        # ``_KNOWN_MUTATION_GAPS`` for the discipline (no new
        # entries to silence freshly-introduced regressions).
        run: python -m taintly --self-test --mutate --no-color
        # Exit 12 if mutation kill rate < 100%

      - name: Mutation gap-growth gate
        # The 100%-modulo-allowlist gate above stays green even if
        # someone adds a new entry to _KNOWN_MUTATION_GAPS to silence
        # a freshly-broken rule. This step asserts the allowlist's
        # SIZE has not grown vs the committed baseline — same growth-
        # only discipline as scripts/check_per_module_coverage.py.
        run: python scripts/check_mutation_gap_count.py

      - name: Integration tests
        run: python -m taintly --integration-test --no-color
        # Exit 10 if any non-bypass integration test fails
        # known_bypass failures are expected and do not fail the build

  # ---------------------------------------------------------------------------
  # Fuzz — adversarial input resilience (scanner as attack surface)
  # Verifies scanner does not crash, hang, or OOM on malformed/adversarial YAML.
  # Inspired by pre-mortem Failure 1: YAML bomb causing runner credential corruption.
  # Inputs include: anchor bombs, null bytes, 100k-char lines, RTL unicode,
  # binary content, deeply nested keys, repeated keys, ReDoS payloads.
  # Single Python version — this is adversarial posture, not compatibility.
  # ---------------------------------------------------------------------------
  fuzz:
    name: Adversarial input (fuzz)
    runs-on: ubuntu-latest
    # Fuzz has per-case timeout guards in the tests; a 20-minute
    # job-level bound catches the case where a new fuzz test explodes
    # in example count and bypasses the per-test cap in aggregate.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See the lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install dev toolchain (hash-pinned)
        # Hash-pinned install — see the lint job for the rationale.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Fuzz tests
        run: pytest tests/fuzz/ --tb=short -q
        # Per-case timeout guards are enforced inside tests/fuzz/test_fuzz_yaml.py.

  # ---------------------------------------------------------------------------
  # Self-audit — run taintly on its own workflow files (dogfood)
  # Must produce zero HIGH or CRITICAL findings on our own CI config.
  # This enforces that the project's CI config follows its own security rules.
  # ---------------------------------------------------------------------------
  audit-self:
    name: Self-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See the lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Audit own workflows
        # Intentionally runs `python -m taintly` against the
        # checked-out tree WITHOUT a prior `pip install -e .`. The package
        # resolves from the current directory, so we audit THIS commit's
        # version of the rules against this commit's workflows — the
        # dogfood loop only works if the code and rules evolve together.
        # Installing a pinned wheel first would decouple them, which is
        # the wrong signal: we want CI to fail when a rule change and a
        # workflow change disagree on the same commit. If the package
        # layout ever moves so `python -m` no longer resolves, switch to
        # `pip install -e . && python -m taintly ...` and update this
        # comment; do NOT add `pip install taintly` from PyPI.
        run: |
          python -m taintly .github/workflows/ \
            --platform github \
            --min-severity HIGH \
            --no-color
          echo "Exit code: $?"
        # Fails with exit 1/2 if any HIGH or CRITICAL findings exist in our own workflows.

  # ---------------------------------------------------------------------------
  # Windows test slice — preventive gate against path-separator
  # regressions and any other OS-specific behaviour drift.
  #
  # The scanner runs fine on Windows for read-only paths, but
  # `endswith` / `split("/")` / `"/ci/" in filepath` checks can
  # silently misclassify legitimate workflow files because
  # os.path.join produces `\`-separated paths on Windows.  This
  # job catches those classes of bug before merge.
  #
  # Discipline:
  # - Single Python version (3.12) — Windows-runner minutes are not
  #   free; the unit suite is OS-sensitive but not interpreter-
  #   sensitive in this layer.  The Linux matrix already covers 3.10
  #   / 3.11 / 3.12 for Python-version compatibility.
  # - Runs the SAME pytest invocation as the Linux unit-test job, but
  #   without coverage instrumentation (Windows coverage tooling adds
  #   flake without catching path bugs).
  # - Bash-driven slices (gitleaks, bandit, fuzz, lint, audit-self)
  #   stay Linux-only — they exercise tooling, not OS-portable code.
  # ---------------------------------------------------------------------------
  windows-test:
    name: Tests (Windows, Python 3.12)
    runs-on: windows-latest
    # Windows-runner startup is ~2x slower than Ubuntu; the budget here
    # matches the Linux unit-test job (15 min) since coverage is off.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # NOTE: no step-security/harden-runner here by design —
      # harden-runner supports Ubuntu runners only, not windows-latest.
      # The egress-boundary control is applied to every Linux job; this
      # Windows slice exists purely for path-separator / OS-portability
      # coverage and runs the same read-only test suite.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        # Install the hash-pinned dev lock (same --require-hashes discipline as
        # the Linux jobs). This is the one runner with no harden-runner egress
        # boundary, so an unpinned/un-hashed install was the soft spot in an
        # otherwise locked-down supply chain.
        # ``python -m pip`` (not bare ``pip``): the lock pins ``pip`` itself and
        # the Windows runner's pip differs, so the ``pip.exe`` launcher hits the
        # "To modify pip, run python -m pip" self-protect guard; the module form
        # lets pip replace itself. (Linux runners ship the lock's pip version, so
        # bare ``pip install`` there doesn't trip it.)
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Unit + integration + evasion tests
        # No coverage gate on Windows — the Linux job already enforces
        # the 78% floor; the Windows job's purpose is OS-portability,
        # not coverage.  If a test fails ONLY on Windows, that's a
        # path / line-ending / case-sensitivity bug worth fixing.
        run: pytest tests/unit/ tests/integration/ tests/evasion/ tests/playground/ --tb=short -q

