          print(f"::notice::{os.environ['CANARY_NAME']} @ {os.environ['CANARY_SHA'][:7]}: {len(findings)} findings, {len(err)} ENGINE-ERR")
          PY

  canary-jenkins:
    name: E2E canary (Jenkins — jenkinsci/plugin-installation-manager-tool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CANARY_REPO: https://github.com/jenkinsci/plugin-installation-manager-tool.git
      CANARY_SHA: 28b6ac3f9b1c5fd7b0bf8095d41a7e5c408c8ccd
      CANARY_NAME: jenkinsci/plugin-installation-manager-tool
    steps:
      # Audited egress boundary (audit mode → block after baseline).
      # See ci.yml's lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
