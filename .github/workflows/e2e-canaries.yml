name: E2E canaries

# Layer 3 of the "don't ship broken rules" enforcement.  The
# in-repo corpus is a fixed set; this workflow scans three
# outside-corpus canary repos (one per platform) on every PR so a
# scanner regression that only surfaces on real-world repos gets
# caught before merge, not after.
#
# Gates (v1, smoke test):
#   * taintly itself exits cleanly (no scanner crash, no Python
#     exception bubbling out).
#   * Findings JSON parses (output is valid).
#
# Surfaces (notices, not blockers):
#   * Total finding count per canary.
#   * ENGINE-ERR count per canary (structural-coverage drift signal —
#     LOW-severity, expected on repos with complex YAML extends/anchors;
#     a future v2 will gate on count <= baseline).
#
# Future v2:
#   * Baseline-vs-current drift gate on findings count and ENGINE-ERR
#     count, baselines in .github/canary-baselines/, auto-updated on
#     main merge, fail PRs that drift > 20%.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref; never cancel on main — see
# ci.yml for the rationale. Doubly useful here: the canary jobs clone
# live external repositories, so serialising same-ref runs also removes
# the chance of two overlapping runs racing on the same clone path.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  canary-github:
    name: E2E canary (GitHub Actions — astral-sh/uv)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CANARY_REPO: https://github.com/astral-sh/uv.git
      CANARY_SHA: e5d20c6e3a67900b499de4cee45513182d55d686
      CANARY_NAME: astral-sh/uv
    steps:
      # Audited egress boundary (audit mode → block + allow-list after
      # baseline). See ci.yml's lint job for the full rationale. NOTE: a
      # future block allow-list for the canary jobs must also include the
      # canary clone hosts (github.com:443, codeload.github.com:443,
      # gitlab.com:443) since these jobs git-clone external repos.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Clone canary at pinned SHA
        run: |
          # Retry the live clone: a transient network blip / rate-limit must not
          # fail the gate for reasons unrelated to the code under review. The
          # assertion stays deterministic — the checkout is pinned to CANARY_SHA.
          for attempt in 1 2 3; do
            rm -rf /tmp/canary
            if git clone --filter=blob:none --no-checkout "$CANARY_REPO" /tmp/canary; then
              break
            fi
            echo "clone attempt $attempt failed; retrying in $((attempt * 5))s" >&2
            sleep "$((attempt * 5))"
          done
          cd /tmp/canary
          git checkout "$CANARY_SHA"

      - name: Scan canary
        # taintly exit codes 0/1/2/11 all mean "scan completed and emitted
        # JSON" (clean / HIGH findings / CRITICAL findings / coverage
        # degraded).  Any of those is fine for a smoke test — the gate is
        # "did the scanner produce parseable output," not "did it find
        # nothing."  Anything else (3 config error, segfault, unexpected
        # exit) is a real failure.
        run: |
          set +e
          python -m taintly /tmp/canary --format json > canary.json
          rc=$?
          set -e
          case "$rc" in
            0|1|2|11) echo "taintly exit=$rc (scan completed, JSON emitted)" ;;
            *)
              echo "::error::taintly exit=$rc — unexpected scanner failure"
              head -c 4000 canary.json || true
              exit 1
              ;;
          esac

      - name: Summarize
        run: |
          python <<'PY'
          import json, os
          d = json.load(open('canary.json'))
          findings = d.get('findings', [])
          err = [f for f in findings if f.get('rule_id','').startswith('ENGINE-ERR')]
          print(f"::notice::{os.environ['CANARY_NAME']} @ {os.environ['CANARY_SHA'][:7]}: {len(findings)} findings, {len(err)} ENGINE-ERR")
          PY

  canary-gitlab:
    name: E2E canary (GitLab CI — gitlab-org/gitlab-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CANARY_REPO: https://gitlab.com/gitlab-org/gitlab-runner.git
      CANARY_SHA: b22b1035770a5f13e648b3d2bc3fedb1f3a59b1c
      CANARY_NAME: gitlab-org/gitlab-runner
    steps:
      # Audited egress boundary (audit mode → block after baseline).
      # See ci.yml's lint job for the full rationale. First step.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
