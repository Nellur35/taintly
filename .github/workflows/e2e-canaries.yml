name: E2E canaries

# Layer 3 of the "don't ship broken rules" enforcement.  The in-repo corpus is
# a fixed set; this workflow defends recall against the specific failure mode
# where a parser/engine refactor silently zeroes a whole rule family: every
# per-rule unit test still passes in isolation and recall on real configs drops
# to zero with no CI signal.
#
# One BLOCKING gate:
#
#   Locked-fixture detection gate (canary-fixtures job).  A small set of
#   committed, public-safe vulnerable CI configs under tests/canaries/
#   (reconstructed from public CVE/advisory shapes) with a committed snapshot of
#   the exact rule-IDs that must fire (tests/canaries/expected_detections.json).
#   scripts/check_canary_detections.py FAILS if any locked rule-ID stops firing.
#   Deterministic; no network; the true barrier.
#
# NOTE: a former secondary "live-repo drift guard" (which cloned a few real
# outside-corpus repositories and tracked their finding counts) was removed
# deliberately. Publishing scan counts that name real third-party projects is
# poor etiquette, and the guard was inert anyway (its baselines were
# `findings: null`, which passed without enforcing). Recall is covered by the
# owned, vulnerable-by-design fixtures above.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref; never cancel on main — see ci.yml for
# the rationale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  canary-fixtures:
    name: Locked-fixture detection gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # This job does no external clone, but actions/checkout + the pinned
      # action downloads still need github.com / codeload egress, so block all
      # egress except those.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            codeload.github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Detection-regression gate (locked vulnerable fixtures)
        # Scans the committed tests/canaries/ fixtures and FAILS if any locked
        # rule-ID stops firing or the per-fixture finding count drops below its
        # floor. This is the deterministic recall barrier; no network, no clone.
        env:
          PYTHONUTF8: "1"
        run: python scripts/check_canary_detections.py


  action-delivery:
    name: Composite Action delivery (manual acceptance)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            codeload.github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run the composite Action with its default scanner on a fixed fixture
        id: action
        uses: ./
        with:
          path: tests/playground/fixtures/github/sec4-gh-001-ppe-target-checkout/fixed
          platform: github
          fail-on: HIGH
          upload-sarif: true
          sarif-file: taintly-action-acceptance.sarif
          extra-args: --no-config

      - name: Verify installed identity, output transport and report delivery
        working-directory: ${{ runner.temp }}
        env:
          TAINTLY_ACTION_EXIT: ${{ steps.action.outputs.exit-code }}
          TAINTLY_ACTION_REPORT: ${{ github.workspace }}/taintly-action-acceptance.sarif
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path

          assert os.environ['TAINTLY_ACTION_EXIT'] == '0'
          distribution = importlib.metadata.distribution('taintly')
          direct = json.loads(distribution.read_text('direct_url.json'))
          assert direct['vcs_info']['commit_id'] == '1b93648956b1abf303e8e4abb69900bf241cd10f'
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          source = workspace / 'tests/playground/fixtures/github/sec4-gh-001-ppe-target-checkout/fixed/.github/workflows/ci.yml'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f322339ef6fbd7503d0db050ed707303c756cd8450e9423e09533199efe3b8ca'
          report = json.loads(Path(os.environ['TAINTLY_ACTION_REPORT']).read_text())
          assert report['version'] == '2.1.0' and isinstance(report['runs'], list)
          results = [result for run in report['runs'] for result in run.get('results', [])]
          assert not any(result['ruleId'] == 'ENGINE-ERR' for result in results)
          def owns_source(result):
              for location in result.get('locations', []):
                  uri = Path(location['physicalLocation']['artifactLocation']['uri'])
                  resolved = uri if uri.is_absolute() else workspace / uri
                  if resolved.resolve() == source.resolve():
                      return True
              return False
          assert any(result['ruleId'] == 'SEC4-GH-005B' and owns_source(result) for result in results)
          print('Pinned scanner, expected source, Action output and local SARIF delivery verified.')
          PY

  tls-delivery:
    name: Pipeline Action delivery (${{ matrix.platform }}, ${{ matrix.case }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jenkins
            case: direct
            exit: "1"
          - platform: jenkins
            case: printed
            exit: "0"
          - platform: jenkins
            case: dynamic
            exit: "11"
          - platform: gitlab
            case: direct
            exit: "0"
          - platform: gitlab
            case: printed
            exit: "0"
          - platform: gitlab
            case: dynamic
            exit: "11"
          - platform: gitlab
            case: mr-publication
            exit: "1"
          - platform: github
            case: review-strict
            exit: "2"
          - platform: github
            case: review-advisory
            exit: "0"
            extra: --review-advisory
          - platform: github
            case: confirmed-advisory
            exit: "2"
            extra: --review-advisory
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            codeload.github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Write a pipeline fixture for static scanning
        env:
          PROBE_CASE: ${{ matrix.case }}
          PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          platform, case = os.environ["PROBE_PLATFORM"], os.environ["PROBE_CASE"]
          root = Path(os.environ["RUNNER_TEMP"]) / "tls-probe"
          root.mkdir()
          if platform == "jenkins":
              commands = {
                  "direct": "httpRequest(url: 'https://example.invalid', ignoreSslErrors: true)",
                  "printed": "echo 'httpRequest(ignoreSslErrors: true)'",
                  "dynamic": "httpRequest(url: 'https://example.invalid', ignoreSslErrors: params.BYPASS)",
              }
              (root / "Jenkinsfile").write_text(commands[case] + "\n")
          elif platform == "github":
              workflows = root / ".github" / "workflows"
              workflows.mkdir(parents=True)
              grant = "write" if case == "confirmed-advisory" else "read"
              (workflows / "probe.yml").write_text(
                  "on: pull_request_target\n"
                  f"permissions: {{contents: {grant}}}\n"
                  "jobs:\n  build:\n    runs-on: ubuntu-latest\n"
                  "    if: github.actor != 'dependabot[bot]'\n"
                  "    steps:\n"
                  "      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n"
                  "        with:\n"
                  "          ref: $" + "{{ github.event.pull_request.head.sha }}\n"
                  "      - run: bash ./build.sh\n",
                  encoding="utf-8",
              )
          elif case == "mr-publication":
              (root / ".gitlab-ci.yml").write_text(
                  'workflow:\n'
                  '  rules:\n'
                  '    - if: $CI_PIPELINE_SOURCE == "merge_request_event"\n'
                  'publish:\n'
                  '  rules:\n'
                  '    - if: $CI_PIPELINE_SOURCE == "merge_request_event"\n'
                  '  id_tokens:\n'
                  '    SIGNING_TOKEN:\n'
                  '      aud: sigstore\n'
                  '  script:\n'
                  '    - docker push registry.example.invalid/preview:probe\n'
              )
          else:
              commands = {
                  "direct": "curl -k https://example.invalid",
                  "printed": "echo 'curl -k https://example.invalid'",
                  "dynamic": "curl -k https://$ENDPOINT",
              }
              (root / ".gitlab-ci.yml").write_text(
                  f"deploy:\n  after_script:\n    - {commands[case]}\n"
              )
          PY
      - name: Scan with the Action default
        id: probe
        uses: ./
        # The probe deliberately exercises expected nonzero exits. The next
        # step requires the exact exit, step outcome and report for each case.
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tls-probe
          platform: ${{ matrix.platform }}
          fail-on: HIGH
          upload-sarif: true
          sarif-file: ${{ runner.temp }}/tls-probe.sarif
          extra-args: --no-config ${{ matrix.extra }}
      - name: Verify installed scanner, Action outcome and SARIF finding
        working-directory: ${{ runner.temp }}
        env:
          PROBE_EXIT: ${{ steps.probe.outputs.exit-code }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          EXPECTED_EXIT: ${{ matrix.exit }}
          PROBE_CASE: ${{ matrix.case }}
          PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path

          exit_code = os.environ["EXPECTED_EXIT"]
          assert os.environ["PROBE_EXIT"] == exit_code
          assert os.environ["PROBE_OUTCOME"] == ("success" if exit_code == "0" else "failure")
          direct = json.loads(importlib.metadata.distribution("taintly").read_text("direct_url.json"))
          assert direct["vcs_info"]["commit_id"] == "1b93648956b1abf303e8e4abb69900bf241cd10f"
          report = json.loads(Path("tls-probe.sarif").read_text())
          assert report["version"] == "2.1.0" and isinstance(report["runs"], list)
          results = [result for run in report["runs"] for result in run.get("results", [])]
          platform, case = os.environ["PROBE_PLATFORM"], os.environ["PROBE_CASE"]
          if platform == "github":
              findings = [item for item in results if item["ruleId"] == "SEC4-GH-001"]
              assert len(findings) == 1
              finding = findings[0]
              assert finding["level"] == "error" and finding["properties"]["review_needed"] is True
              location = finding["locations"][0]["physicalLocation"]
              assert Path(location["artifactLocation"]["uri"]).name == "probe.yml"
              assert location["region"]["startLine"] == 10
              confirmed = case == "confirmed-advisory"
              assert finding["properties"]["exploitability"] == ("high" if confirmed else "medium")
              blockers = [item for item in results if item["ruleId"] == "PSE-GH-006"]
              assert len(blockers) == int(confirmed)
              if blockers:
                  assert blockers[0]["level"] == "error"
                  assert not blockers[0]["properties"].get("review_needed", False)
              print("Installed scanner, GitHub exit gate and SARIF evidence verified.")
              raise SystemExit(0)
          rule_id = {"jenkins": "SEC6-JK-009", "gitlab": "SEC6-GL-012"}[platform]
          if case == "mr-publication":
              rule_id = "CHAIN-GL-101"
          expected_finding = case in {"direct", "mr-publication"} or (
              platform == "gitlab" and case == "dynamic"
          )
          findings = [result for result in results if result["ruleId"] == rule_id]
          diagnostics = [
              notification
              for run in report["runs"]
              for invocation in run.get("invocations", [])
              for notification in invocation.get("toolExecutionNotifications", [])
              if notification["descriptor"]["id"] == "ENGINE-ERR"
              and rule_id in notification["message"]["text"]
          ]
          assert len(findings) == int(expected_finding)
          assert len(diagnostics) == (1 if exit_code == "11" else 0)
          if findings:
              location = findings[0]["locations"][0]["physicalLocation"]
              expected_name, expected_line, level = {
                  "jenkins": ("Jenkinsfile", 1, "error"),
                  "gitlab": (".gitlab-ci.yml", 3, "warning"),
              }[platform]
              if case == "mr-publication":
                  expected_line, level = 11, "error"
              assert findings[0]["level"] == level
              assert location["region"]["startLine"] == expected_line
              assert Path(location["artifactLocation"]["uri"]).name == expected_name
              if platform == "gitlab":
                  assert findings[0]["properties"]["review_needed"] is True
              if case == "mr-publication":
                  notes = " ".join(findings[0]["properties"]["context_notes"])
                  assert "SIGNING_TOKEN" in notes and "write grants are unverified" in notes
          print(f"Installed scanner, expected exit {exit_code}, and SARIF verified.")
          PY
