          git checkout "$CANARY_SHA"

      - name: Scan canary
        # See note in canary-github above — taintly exits 0/1/2/11 on
        # successful scans; only 3 / unexpected codes are real failures.
        run: |
          set +e
          python -m taintly /tmp/canary --platform gitlab --format json > canary.json
