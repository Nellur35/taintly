# vulnerable: PR-target trigger checks out attacker PR head SHA, then runs npm install + tests
# EXPECT: SEC4-GH-001 fires (CRITICAL)
name: ci
on: pull_request_target
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm test
