name: AI agent on PR (hardened)
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  agent:
    if: github.event.review.state == 'approved' && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v4
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@b0c1ad0e4cdf4a1b0efb8f8a76b62e08c66d1234 # v1.2.3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
