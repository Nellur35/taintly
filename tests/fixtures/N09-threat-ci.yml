name: Private controlled evaluation
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create report
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: printf '%s\n' "$REPORT_TOKEN" > report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt
