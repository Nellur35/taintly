# Negative corpus: GitLab CI ``rules: if:`` plain-style flow continuation.
#
# Source: GNOME/glib `.gitlab-ci.yml:65-72` and many real-world configs.
#
# YAML allows an inline scalar value to span multiple lines via plain-
# style flow continuation when subsequent lines are more deeply
# indented than the key.  GitLab CI's ``if:`` expression DSL is
# evaluated by the GitLab engine, NOT by a shell — so ``$CI_*``
# references inside the continuation are GitLab-engine variables,
# not bash word-split targets.  The ``_gitlab_rules_if_body_lines``
# helper masks continuation lines for any ``if:`` value (inline,
# block-scalar, or empty), letting the rule fire only on real shell
# usage of these variables.
.only-default-filter-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" &&
          $CI_PROJECT_NAMESPACE == "GNOME" &&
          $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" ||
          $CI_MERGE_REQUEST_TITLE =~ /Draft:/
      when: never
