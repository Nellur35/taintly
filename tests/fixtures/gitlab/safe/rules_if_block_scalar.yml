# Regression fixture for FP-audit class C (2026-05-17):
# Multi-line ``rules: - if: |`` block scalars in GitLab CI configs
# (shape lifted from real gitlabhq/.gitlab/ci/rules.gitlab-ci.yml).
# The ``if:`` value is a GitLab CI expression DSL — NOT a shell — so
# unquoted ``$CI_*`` references in continuation lines have NO shell-
# injection surface and must produce ZERO findings from SEC4-GL-001
# / SEC4-GL-003.
.if-default-branch-or-stable-ee-or-auto-deploy-only:
  rules:
    - if: |
        $SCHEDULE_TYPE != "weekly"
        && $TRIGGERED_BY_AI_GATEWAY_PROJECT != "true"
        &&
        (
          $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
          || $CI_COMMIT_REF_NAME =~ /^[\d-]+-stable(-ee)?$/
          || $CI_COMMIT_REF_NAME =~ /^\d+-\d+-auto-deploy-\d+$/
          || $CI_COMMIT_TAG
          || $CI_MERGE_REQUEST_TITLE =~ /Revert "/
          || $CI_COMMIT_BRANCH == "main"
          || $CI_COMMIT_MESSAGE =~ /chore: release/
        )

.if-merge-request-needs-rebuild:
  rules:
    - if: >
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "renovate"
        && $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

# Sanity: a plain inline ``if:`` value MUST still be suppressed
# (the existing same-line ``^\s*-?\s*if:`` exclude handles it).
.if-inline:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_REF_NAME =~ /^release/
