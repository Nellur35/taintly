name: pr checkout safe (persist-credentials: false)

# Explicit persist-credentials: false on the checkout under a
# fork-reachable trigger.  Both SEC4-GH-005 and SEC4-GH-005B must
# stay silent — the persisted-token attack surface is closed.
#
# Anchored by github-tanstack-posture-design-v1 (2026-05-19).

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          pytest
          echo "PR #${{ github.event.number }} tested"
