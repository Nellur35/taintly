# Sanitized from nodejs/node scheduled dependency-update cache posture.
name: safe push hashfiles cache

on:
  schedule:
    - cron: "5 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.npm
          key: node-update-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
