# release_metadata_custom_name.yml - safe fixture for SEC1-GH-001.
#
# A custom-named release metadata job prepares release notes/PRs only.
# It does not publish packages, push images, create releases, or deploy.
name: Release metadata

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@1111111111111111111111111111111111111111
        with:
          release-type: simple
