# Flow-style step list — uncommon but valid YAML.  The
# structural form of SEC3-GH-001 must walk into flow-mapping
# steps and detect the unpinned action reference.  Locks in
# that behaviour against future walker regressions.
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps: [{uses: tj-actions/changed-files@v44}, {run: echo build}]
