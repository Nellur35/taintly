name: sibling-job-only
on:
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare credential-backed file
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          mkdir -p reports
          printf 'credential=%s\n' "$REPORT_TOKEN" > reports/private.txt
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Upload public report
        uses: actions/upload-artifact@v4
        with:
          name: public-report
          path: reports/public.txt
