name: aliased-secret-env-consumer
on:
  pull_request:
permissions:
  contents: read
env:
  REPORT_TOKEN: &report_token ${{ secrets.REPORT_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate report with inherited credential
        env:
          REPORT_TOKEN: *report_token
        run: python scripts/export_report.py
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build.txt
