name: dynamic-matrix-workflow-dispatch
on:
  workflow_dispatch:
    inputs:
      matrix_payload:
        required: true
        type: string
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.matrix_payload) }}
    steps:
      - name: Write matrix report
        env:
          REPORT_VALUE: ${{ matrix.report_value }}
        run: |
          mkdir -p reports
          printf 'value=%s\n' "$REPORT_VALUE" > reports/build-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build-report.txt
