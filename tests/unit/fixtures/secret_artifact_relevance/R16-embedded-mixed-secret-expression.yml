name: embedded-mixed-secret-expression
on:
  pull_request:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: [true, false]
    steps:
      - name: Write conditional report
        run: |
          mkdir -p reports
          printf 'credential=%s\n' "${{ matrix.flag && secrets.REPORT_TOKEN }}" > reports/build-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build-report.txt
