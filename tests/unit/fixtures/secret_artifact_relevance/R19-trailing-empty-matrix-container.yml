name: trailing-empty-matrix-container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, []]
    steps:
      - name: Write matrix report
        env:
          REPORT_VALUE: ${{ matrix.rid }}
        run: |
          mkdir -p reports
          printf 'value=%s\n' "$REPORT_VALUE" > reports/build-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build-report.txt
