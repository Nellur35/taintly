name: literal-log-hint
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write literal documentation text
        run: |
          mkdir -p reports
          printf 'The key name secrets.REPORT_TOKEN is documented here\n' > reports/readme.txt
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: reports/readme.txt
