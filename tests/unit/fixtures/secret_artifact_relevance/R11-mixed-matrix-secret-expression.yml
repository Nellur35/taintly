name: mixed-matrix-secret-expression
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: [true, false]
    steps:
      - name: Write mixed-context report
        env:
          REPORT_TOKEN: ${{ matrix.flag && secrets.REPORT_TOKEN }}
        run: |
          mkdir -p reports
          printf 'credential=%s\n' "$REPORT_TOKEN" > reports/build.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build.txt
