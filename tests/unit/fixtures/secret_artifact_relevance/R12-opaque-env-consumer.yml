name: opaque-env-consumer
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate report with an opaque program
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python scripts/export_report.py
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/build.txt
