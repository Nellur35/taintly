name: ordered-direct-secret-write
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize credential report
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          mkdir -p reports
          printf 'credential=%s\n' "$REPORT_TOKEN" > reports/build.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/build.txt
